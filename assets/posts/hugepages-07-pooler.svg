<rect x="90" y="218" width="220" height="46" fill="#2b1c1c" stroke="#e57373" stroke-width="1.5" rx="6"/>
<text x="200.0" y="237.32" fill="#e57373" font-size="12" text-anchor="middle" font-weight="normal">500 page tables</text>
<text x="200.0" y="253.32" fill="#e57373" font-size="12" text-anchor="middle" font-weight="normal">15.6 GB</text>
<text x="615" y="74" fill="#b5e853" font-size="13" text-anchor="middle" font-weight="bold">with a pooler</text>
<rect x="505" y="88" width="220" height="40" fill="#242424" stroke="#3a3a3a" stroke-width="1.5" rx="6"/>
<text x="615.0" y="112.68" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="normal">500 clients</text>
<path d="M615,128 L615,152" stroke="#b5e853" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
<rect x="505" y="152" width="220" height="44" fill="#242424" stroke="#b5e853" stroke-width="1.5" rx="6"/>
<text x="615.0" y="178.68" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="normal">30 backends  (pool_size)</text>
<path d="M615,196 L615,218" stroke="#b5e853" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
