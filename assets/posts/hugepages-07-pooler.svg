<text x="615.0" y="237.32" fill="#b5e853" font-size="12" text-anchor="middle" font-weight="normal">30 page tables</text>
<text x="615.0" y="253.32" fill="#b5e853" font-size="12" text-anchor="middle" font-weight="normal">960 MB</text>
<text x="410.0" y="300" fill="#9aa0a6" font-size="12" text-anchor="middle" font-weight="normal" font-style="italic">the same shared_buffers underneath both</text>
